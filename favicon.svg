<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Stylized Anatomical Heart & Rib/Spine Caduceus Emblem -->
  <g filter="url(#glow)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart contour left -->
    <path d="M256 160 C210 100 130 110 130 185 C130 250 200 310 256 360 C312 310 382 250 382 185 C382 110 302 100 256 160 Z" stroke-width="16" fill="rgba(255,255,255,0.12)" />
    <!-- Central spinal axis -->
    <line x1="256" y1="130" x2="256" y2="390" stroke-width="22" />
    <!-- Vertebral / Rib arches -->
    <path d="M190 205 Q256 225 322 205" stroke-width="14" />
    <path d="M180 250 Q256 270 332 250" stroke-width="14" />
    <path d="M195 295 Q256 312 317 295" stroke-width="14" />
    <!-- Superior vascular arches -->
    <path d="M235 130 Q225 90 200 95" stroke-width="12" />
    <path d="M256 130 V85" stroke-width="14" />
    <path d="M277 130 Q290 88 315 95" stroke-width="12" />
  </g>
</svg>
